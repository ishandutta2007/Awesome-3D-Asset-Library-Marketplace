<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Mesh Wireframe Glow -->
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 20px); opacity: 0.6; }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(5deg); }
    }
    @keyframes rotateIso {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -120; }
    }
    @keyframes cardFloatLeft {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes cardFloatRight {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 180px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 240px; }
    .cube-float { animation: floatCube 7s ease-in-out infinite; }
    .dash-line { stroke-dasharray: 8 6; animation: dashMove 14s linear infinite; }
    .card-left { animation: cardFloatLeft 6s ease-in-out infinite; }
    .card-right { animation: cardFloatRight 6s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; letter-spacing: 0.2px; }
    .mono-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 600; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Mesh -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs (in Background) -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="220" cy="140" r="130" fill="#38bdf8" />
    <circle class="orb-2" cx="1020" cy="270" r="150" fill="#a855f7" />
    <circle cx="600" cy="60" r="100" fill="#6366f1" opacity="0.2" />
  </g>

  <!-- Decorative Animated 3D Floating Geometry Elements (Sides) -->
  <!-- Left Side: Isometric Wireframe Cube -->
  <g class="cube-float" transform="translate(90, 160)">
    <!-- Top Face -->
    <polygon points="50,10 90,32 50,54 10,32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" opacity="0.85" />
    <!-- Left Face -->
    <polygon points="10,32 50,54 50,100 10,78" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" opacity="0.9" />
    <!-- Right Face -->
    <polygon points="50,54 90,32 90,78 50,100" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.8" opacity="0.9" />
    <!-- Dynamic Orbiting Circle -->
    <ellipse cx="50" cy="55" rx="65" ry="32" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" class="dash-line" opacity="0.75" />
  </g>

  <!-- Right Side: Isometric 3D Diamond / Polyhedron Structure -->
  <g class="cube-float" transform="translate(1010, 150)" style="animation-delay: -3.5s;">
    <!-- Top Pyramidal Cap -->
    <polygon points="55,5 95,45 55,75 15,45" fill="#312e81" stroke="#f472b6" stroke-width="1.8" opacity="0.85" />
    <!-- Lower Inverted Cap -->
    <polygon points="15,45 55,75 55,120" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.8" opacity="0.9" />
    <polygon points="55,75 95,45 55,120" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" opacity="0.9" />
    <!-- Dynamic Orbiting Ring -->
    <ellipse cx="55" cy="62" rx="70" ry="30" fill="none" stroke="#38bdf8" stroke-width="1.5" class="dash-line" opacity="0.7" />
  </g>

  <!-- Foreground Dynamic UI Cards / Badges (Non-blocking) -->
  <g class="card-left" transform="translate(60, 42)">
    <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#slightGlow)" />
    <text x="34" y="22" fill="#94a3b8" class="mono-badge">⚡ CC0 &amp; PBR ASSETS</text>
  </g>

  <g class="card-right" transform="translate(960, 42)">
    <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#a855f7" filter="url(#slightGlow)" />
    <text x="34" y="22" fill="#94a3b8" class="mono-badge">📦 SELF-HOSTED 3D</text>
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Crystal Clear Foreground) -->
  <g id="foreground-content">
    <!-- Top Pill Tag -->
    <g transform="translate(470, 75)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
      <text x="130" y="20" text-anchor="middle" fill="#a5b4fc" class="mono-badge" font-size="12">THE DEFINITIVE 3D ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" fill="url(#textGrad)" class="title-text" font-size="44" filter="url(#slightGlow)">
      Awesome 3D Asset Library &amp; Marketplace
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" fill="#e2e8f0" class="subtitle-text" font-size="18">
      Curated Commercial SaaS Platforms, CC0 Repositories &amp; Self-Hosted Marketplaces
    </text>

    <!-- Tagline & Tech Stack Badges in Foreground -->
    <g transform="translate(310, 260)">
      <!-- Pill 1: glTF / GLB -->
      <g transform="translate(0, 0)">
        <rect width="125" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="62" y="23" text-anchor="middle" fill="#7dd3fc" class="mono-badge">📦 glTF / GLB</text>
      </g>
      <!-- Pill 2: PBR Textures -->
      <g transform="translate(145, 0)">
        <rect width="145" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="72" y="23" text-anchor="middle" fill="#c7d2fe" class="mono-badge">🎨 PBR Textures</text>
      </g>
      <!-- Pill 3: HDRIs -->
      <g transform="translate(310, 0)">
        <rect width="115" height="36" rx="18" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <text x="57" y="23" text-anchor="middle" fill="#e9d5ff" class="mono-badge">🌅 HDRIs</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(445, 0)">
        <rect width="135" height="36" rx="18" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" />
        <text x="67" y="23" text-anchor="middle" fill="#fbcfe8" class="mono-badge">✨ Open Source</text>
      </g>
    </g>

    <!-- Supported Engine Badges Footer Bar -->
    <g transform="translate(370, 335)">
      <text x="230" y="22" text-anchor="middle" fill="#64748b" class="mono-badge" font-size="13">
        Built for Blender • Unreal Engine • Unity • Godot • Three.js • WebXR
      </text>
    </g>
  </g>
</svg>
